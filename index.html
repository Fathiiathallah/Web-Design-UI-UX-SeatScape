<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ICON -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- FONT Playfair -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <title>AdoreU Space</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <div class="top-header">
    <img src="./images/logo.png.png" alt="Logo" class="logo">
  </div>

  <!-- MAIN -->
  <div class="wrapper">

    <!-- TEXT ATAS -->
    <div class="welcome-text">
      <h1 class="title-main">Hello there,</h1>
      <p class="title-sub">Welcome Back to Seatscape!</p>
    </div>

    <!-- CARD -->
    <div class="card">

      <h3>Registration</h3>
      <p class="login-text">already have an account? <span>Login</span></p>

      <div class="input-group">
        <i class="fa-regular fa-user"></i>
        <input type="text" placeholder="Username">
      </div>

      <div class="input-group">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" placeholder="Email">
      </div>

      <div class="input-group">
        <i class="fa-regular fa-eye"></i>
        <input type="password" placeholder="Password">
      </div>

      <!-- FORGOT PASSWORD -->
      <p class="forgot-password">Forgot Password?</p>

      <button class="btn-primary">Register</button>
      <button class="btn-secondary">Back to home</button>

    </div>

  </div>

</body>
</html>
